<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Warm terracotta studio backdrop -->
    <radialGradient id="studioBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EEDACD"/>
      <stop offset="60%" stop-color="#D1A384"/>
      <stop offset="100%" stop-color="#9C6B51"/>
    </radialGradient>
    <linearGradient id="skinBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5CEB3"/>
      <stop offset="60%" stop-color="#E2AC87"/>
      <stop offset="100%" stop-color="#C28662"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2820"/>
      <stop offset="100%" stop-color="#1B120E"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#32596E"/>
      <stop offset="70%" stop-color="#1E3745"/>
      <stop offset="100%" stop-color="#11212B"/>
    </linearGradient>
    <linearGradient id="sweaterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7EFE9"/>
      <stop offset="100%" stop-color="#DAC8BB"/>
    </linearGradient>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="600" fill="url(#studioBg)"/>

  <!-- Subtle Studio Rim Light Glow -->
  <circle cx="280" cy="240" r="260" fill="#FFE5D4" opacity="0.18"/>

  <!-- Shoulders & Coat -->
  <path d="M 210 600 L 260 440 Q 330 405 400 410 Q 470 405 540 440 L 590 600 Z" fill="url(#jacketGrad)"/>

  <!-- Wool Sweater Collar -->
  <path d="M 330 420 Q 400 445 470 420 L 485 490 Q 400 520 315 490 Z" fill="url(#sweaterGrad)"/>

  <!-- Neck -->
  <path d="M 350 310 L 350 435 Q 400 445 450 435 L 450 310 Z" fill="#D39772"/>
  <path d="M 370 330 Q 400 375 430 330 L 430 430 Q 400 440 370 430 Z" fill="#BF815C" opacity="0.35"/>

  <!-- Head & Face Base -->
  <path d="M 320 220 Q 315 320 400 375 Q 485 320 480 220 Q 475 140 400 135 Q 325 140 320 220 Z" fill="url(#skinBase)"/>

  <!-- Cheekbone & Shadow Contours -->
  <path d="M 325 240 Q 350 280 370 320 Q 345 320 330 270 Z" fill="#B37350" opacity="0.25"/>
  <path d="M 475 240 Q 450 280 430 320 Q 455 320 470 270 Z" fill="#B37350" opacity="0.35"/>
  <!-- Gentle Blush / Warmth -->
  <ellipse cx="355" cy="270" rx="30" ry="18" fill="#E8826F" opacity="0.2"/>
  <ellipse cx="445" cy="270" rx="30" ry="18" fill="#E8826F" opacity="0.2"/>

  <!-- Eyes -->
  <ellipse cx="360" cy="235" rx="18" ry="10" fill="#FBF8F5"/>
  <circle cx="361" cy="235" r="7" fill="#42291D"/>
  <circle cx="362" cy="233" r="2.5" fill="#FFFFFF"/>
  <path d="M 340 230 Q 360 222 380 230" stroke="#2B1A12" stroke-width="3" fill="none" stroke-linecap="round"/>

  <ellipse cx="440" cy="235" rx="18" ry="10" fill="#FBF8F5"/>
  <circle cx="439" cy="235" r="7" fill="#42291D"/>
  <circle cx="440" cy="233" r="2.5" fill="#FFFFFF"/>
  <path d="M 420 230 Q 440 222 460 230" stroke="#2B1A12" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M 335 215 Q 360 205 385 212" stroke="#24160E" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 415 212 Q 440 205 465 215" stroke="#24160E" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M 400 230 L 396 280 Q 400 290 405 288" stroke="#BF7D57" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 388 285 Q 400 294 412 285" stroke="#A86743" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Lips -->
  <path d="M 375 320 Q 400 314 425 320 Q 400 332 375 320 Z" fill="#BA6057"/>
  <path d="M 380 322 Q 400 336 420 322 Q 400 342 380 322 Z" fill="#D47369"/>

  <!-- Modern Styled Hair -->
  <path d="M 315 210 Q 300 120 400 95 Q 500 120 485 210 Q 510 180 500 130 Q 480 75 400 70 Q 320 75 300 130 Q 290 180 315 210 Z" fill="url(#hairGrad)"/>
  <path d="M 305 160 Q 320 120 375 125 Q 430 115 480 150 Q 430 135 380 138 Q 330 135 305 160 Z" fill="#5A3E31"/>
</svg>
